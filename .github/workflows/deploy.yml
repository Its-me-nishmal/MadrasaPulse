name: MadrasaPulse Play Store Deployment Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-play-store:
    name: Build & Upload to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter Packages
        run: |
          cd frontend
          flutter pub get

      - name: Decrypt Android Release Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/upload-keystore.jks

      - name: Generate key.properties Configuration
        run: |
          cat <<EOF > frontend/android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android App Bundle (AAB)
        run: |
          cd frontend
          flutter build appbundle --release

      - name: Direct Upload to Google Play Internal Testing Track
        uses: r0adrunner/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.itsmenishmal.madrasapulse
          releaseFiles: frontend/build/app/outputs/bundle/release/app-release.aab
          track: internal
