name: MadrasaPulse CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Verify API Alignment (Frontend vs Backend)
        run: node scripts/verify_api_alignment.js

      - name: Run Backend Integration Tests
        run: npm test --workspace=backend
        env:
          MONGODB_URI: mongodb://localhost:27017/madrasapulse_test
          JWT_ACCESS_SECRET: integration_test_access_secret_key_123
          JWT_REFRESH_SECRET: integration_test_refresh_secret_key_456

  frontend-test:
    name: Flutter Frontend Validations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java (Required for Flutter Android builds/tests)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter Packages
        run: |
          cd frontend
          flutter pub get

      - name: Flutter Linter Analysis
        run: |
          cd frontend
          flutter analyze

      - name: Run Flutter Tests
        run: |
          cd frontend
          flutter test
