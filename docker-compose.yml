version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: madrasapulse_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://db:27017/madrasapulse
      - JWT_SECRET=supersecretactivationkeyherefordevelopment
      - JWT_REFRESH_SECRET=anotherrefreshsecretactivationkeyherefordevelopment
      - NODE_ENV=production
    depends_on:
      - db
    restart: always

  db:
    image: mongo:latest
    container_name: madrasapulse_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
